<section class="card">
    <h2>تماس با من</h2>

    <form onsubmit="sendMessage(event)">
        <input type="text" placeholder="نام شما" required>
        <input type="email" placeholder="ایمیل شما" required>
        <textarea placeholder="پیام شما" required></textarea>
        <button class="btn" type="submit">ارسال پیام</button>
    </form>

    <p id="msg"></p>
</section>

<script>
function sendMessage(e) {
    e.preventDefault();
    document.getElementById("msg").innerText =
        "پیام شما با موفقیت ثبت شد ✅ (نسخه تمرینی)";
}
</script>
